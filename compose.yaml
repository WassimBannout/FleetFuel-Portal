# Local development stack for FleetFuel Portal.
# Use the Makefile (make setup, make up, make test, ...) instead of calling
# these services directly; docs/02-ARCHITECTURE.md describes the contract.
# Values such as ${DB_PASSWORD} are read from .env, which `make setup` creates.
# COMPOSE_PROJECT_NAME in .env overrides this name for a second copy.
name: fleetfuel

x-php-service: &php-service
    build:
        context: docker/php
        args:
            UID: ${HOST_UID:-1000}
            GID: ${HOST_GID:-1000}
    # Named after the project, so a second copy never rebuilds this copy's image.
    image: ${COMPOSE_PROJECT_NAME:-fleetfuel}-app:dev
    volumes:
        - .:/var/www/html
    depends_on:
        mysql:
            condition: service_healthy

services:
    # PHP-FPM running the Laravel application.
    app:
        <<: *php-service

    # Runs Laravel's scheduler (later: rates:sync) once a minute.
    scheduler:
        <<: *php-service
        command: ["php", "artisan", "schedule:work"]

    # Nginx serves public/ and forwards PHP requests to `app`.
    web:
        image: nginx:1.30-alpine
        ports:
            - "127.0.0.1:${APP_PORT:-8080}:80"
        volumes:
            - ./public:/var/www/html/public:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
        depends_on:
            - app
        healthcheck:
            # /up is Laravel's liveness route: it proves PHP boots the app.
            test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 6
            start_period: 10s

    # MySQL with a persistent named volume. No host port is published.
    mysql:
        image: mysql:8.4
        environment:
            # Nobody needs root after the first start; the app uses its own users.
            MYSQL_RANDOM_ROOT_PASSWORD: "yes"
            MYSQL_DATABASE: ${DB_DATABASE:-fleetfuel}
            MYSQL_USER: ${DB_USERNAME:-fleetfuel}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Run make setup to create .env}
            MYSQL_TEST_DATABASE: ${DB_TEST_DATABASE:-fleetfuel_test}
            MYSQL_TEST_USER: ${DB_TEST_USERNAME:-fleetfuel_test}
            MYSQL_TEST_PASSWORD: ${DB_TEST_PASSWORD:?Run make setup to create .env}
        volumes:
            - mysql-data:/var/lib/mysql
            - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
            - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            # Uses TCP, not the socket, so it only passes after first-start
            # initialisation finishes and the real server accepts connections.
            test: ["CMD-SHELL", "mysqladmin ping --silent -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\""]
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s

    # On-demand Node container for installing and building frontend assets.
    node:
        image: node:24.21-alpine
        profiles: [tools]
        working_dir: /app
        user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
        environment:
            npm_config_cache: /tmp/.npm
        volumes:
            - .:/app

    # Optional email inspection UI: docker compose --profile mail up -d mailpit
    mailpit:
        image: axllent/mailpit:v1.31
        profiles: [mail]
        ports:
            - "127.0.0.1:8025:8025"

volumes:
    mysql-data:
