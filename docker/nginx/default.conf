# Serves Laravel's public/ directory and passes PHP requests to PHP-FPM in the
# `app` container. Only public/ is mounted into this container.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    charset utf-8;
    server_tokens off;
    client_max_body_size 12m;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Resolve "app" through Docker's embedded DNS at request time. A fixed
    # upstream is resolved once at startup and breaks (502) when the app
    # container is recreated with a new IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (except ACME challenges) or any PHP file but index.php.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~ \.php$ {
        return 404;
    }
}
