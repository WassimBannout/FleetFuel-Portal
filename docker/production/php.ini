; PHP settings of the production image.
; Persist and compare timestamps in UTC; business months use Asia/Beirut in code.
date.timezone = UTC
expose_php = Off
display_errors = Off
log_errors = On
; Keep argument values (e.g. the DB password passed to PDO) out of logged stack traces.
zend.exception_ignore_args = On
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M

; The code never changes inside a running container, so files are compiled once.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
