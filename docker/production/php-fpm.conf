; PHP-FPM pool overrides for the production image (loaded after the
; official image's www.conf, docker.conf and zz-docker.conf). The pool's
; user/group lines are disabled in the Dockerfile: the whole container runs
; as the non-root `app` user.
[www]
; Only nginx in the same container talks to FPM.
listen = 127.0.0.1:9000
; Keep the container's environment for the workers. Configuration is cached
; on start, but a missing cache must not leave the workers without it.
clear_env = no
; nginx already logs every request.
access.log = /dev/null
