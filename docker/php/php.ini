; Development overrides for the FleetFuel app and scheduler containers.
; Persist and compare timestamps in UTC; business months use Asia/Beirut in code.
date.timezone = UTC
expose_php = Off
; Keep argument values (e.g. the DB password passed to PDO) out of logged stack traces.
zend.exception_ignore_args = On
memory_limit = 512M
upload_max_filesize = 10M
post_max_size = 12M

; Re-check files on every request because source is bind-mounted and edited live.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
